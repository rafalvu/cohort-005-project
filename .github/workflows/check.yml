name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || (github.ref_name == github.event.repository.default_branch && github.event.before) || '' }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
